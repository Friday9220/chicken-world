<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="assets/img/favicon.svg?v=2" type="image/svg+xml">
  <title>Ordrer – Chicken World</title>
  <link rel="stylesheet" href="styles.css?v=45">
  <style>
    body { background: var(--frame); }
    [hidden] { display: none !important; }
    .wrap { padding: 18px clamp(14px, 3vw, 32px) 40px; color: var(--cream); }
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
    .top h1 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1; }
    .top h1 span { color: var(--orange); }
    .live { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; opacity: .8; }
    .live .dot.is-off { background: #c0392b; box-shadow: 0 0 0 4px rgba(192,57,43,.3); }
    .top .spacer { flex: 1; }
    .tbtn { font: inherit; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 10px 18px; cursor: pointer; border: 2px solid var(--cream); background: transparent; color: var(--cream); }
    .pstat { font-weight: 700; font-size: 14px; border-radius: 999px; padding: 8px 14px; background: rgba(245,239,227,.12); }
    .pstat.is-ok { background: var(--green); }
    .pstat.is-bad { background: #c0392b; }
    .tbtn.is-on { background: var(--green); border-color: var(--green); }
    @keyframes pulse { 50% { opacity: .75; } }
    .tbtn:focus-visible, .act:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
    .col h2 { display: flex; align-items: center; gap: 10px; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 10px; }
    .col h2 b { background: var(--cream); color: var(--ink); border-radius: 999px; min-width: 28px; height: 28px; display: grid; place-items: center; padding: 0 8px; font-size: 14px; }
    .col--ny h2 b { background: var(--orange); color: #fff; }
    .list { display: grid; gap: 12px; }
    .empty { opacity: .5; font-size: 15px; padding: 18px; border: 1.5px dashed rgba(245,239,227,.3); border-radius: 16px; text-align: center; }

    .order { background: var(--cream); color: var(--ink); border-radius: 18px; padding: 16px; display: grid; gap: 10px; }
    .col--ny .order { box-shadow: inset 0 0 0 4px var(--orange); }
    .order.is-new { animation: flash 1.2s ease 3; }
    .o-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .o-id { font-family: var(--display); font-size: 30px; line-height: 1; }
    .o-pick { text-align: right; font-weight: 700; font-size: 17px; }
    .o-pick small { display: block; font-weight: 500; font-size: 13px; color: var(--muted); }
    .o-who { font-size: 15px; }
    .o-who b { font-size: 17px; }
    .o-items { list-style: none; display: grid; gap: 4px; border-top: 1.5px dashed var(--cream-2); border-bottom: 1.5px dashed var(--cream-2); padding: 10px 0; font-size: 16px; }
    .o-items li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; font-variant-numeric: tabular-nums; }
    .o-items .q { font-weight: 700; }
    .o-items .p { color: var(--muted); }
    .o-note { background: #fff1d6; border-radius: 10px; padding: 8px 10px; font-weight: 700; }
    .o-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .o-total { font-family: var(--display); font-size: 24px; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .act { font: inherit; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--ink); background: var(--ink); color: var(--cream); cursor: pointer; }
    .act--go { background: var(--orange); border-color: var(--orange); color: #fff; }
    .act--ghost { background: transparent; color: var(--ink); }
    .act--warn { background: #c0392b; border-color: #c0392b; color: #fff; }

    .done { margin-top: 28px; }
    .done summary { cursor: pointer; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; opacity: .8; }
    .done ul { list-style: none; margin-top: 10px; display: grid; gap: 6px; }
    .done li { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: rgba(245,239,227,.08); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
    .done li .st { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; border-radius: 999px; padding: 3px 8px; background: rgba(245,239,227,.15); }
    .done li button { margin-left: auto; font: inherit; font-size: 13px; background: none; border: 1.5px solid rgba(245,239,227,.4); color: var(--cream); border-radius: 999px; padding: 4px 10px; cursor: pointer; }

    .gate { max-width: 520px; margin: 12vh auto 0; text-align: center; display: grid; gap: 14px; }
    .gate h1 { font-family: var(--display); font-weight: 400; font-size: 44px; }
    .login { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .login input { flex: 1 1 220px; font: inherit; font-size: 20px; padding: 14px 18px; border-radius: 14px; border: 2px solid rgba(245,239,227,.4); background: rgba(245,239,227,.08); color: var(--cream); }
    .login button { font: inherit; font-size: 20px; font-weight: 700; padding: 14px 24px; border-radius: 14px; border: 0; background: var(--yellow, #ffb81c); color: #2b1710; cursor: pointer; }
    .login button:disabled { opacity: .6; cursor: wait; }
    .err { background: #c0392b; color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 700; margin-bottom: 14px; }

    .decide { display: grid; gap: 8px; background: #fff; border-radius: 14px; padding: 10px; }
    .decide__lbl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .eta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .eta .act { padding: 14px 2px; font-size: 16px; white-space: nowrap; border-radius: 14px; }
    .decide > .act { width: 100%; }
    .o-eta { font-weight: 700; font-size: 17px; background: var(--yellow); border-radius: 10px; padding: 8px 10px; }
    .tag { display: inline-block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border-radius: 999px; padding: 3px 9px; margin-bottom: 4px; }
    .tag--lev { background: var(--red); color: #fff; }
    .tag--hent { background: var(--cream-2); color: var(--ink); }
    .tag--udl { background: #3fa9f5; color: #fff; }
    .o-addr { font-weight: 700; font-size: 17px; background: #ffe1dc; border-radius: 10px; padding: 8px 10px; }
    .o-addr a { color: var(--ink); }
    .o-disc { font-weight: 800; font-size: 15px; background: #d9f2e3; border-radius: 10px; padding: 6px 10px; }
    .o-pay { font-weight: 800; font-size: 16px; background: #e7e0ff; border-radius: 10px; padding: 6px 10px; margin-top: 6px; }
    .act--print { background: transparent; color: var(--ink); }
    #bon { display: none; }
    @media print {
      @page { size: 80mm auto; margin: 3mm; }
      body { background: #fff !important; }
      .wrap { display: none !important; }
      #bon { display: block; color: #000; font: 13px/1.35 system-ui, sans-serif; width: 72mm; }
      #bon h1 { font-size: 26px; margin: 0; }
      #bon .big { font-size: 17px; font-weight: 700; }
      #bon hr { border: 0; border-top: 1px dashed #000; margin: 6px 0; }
      #bon table { width: 100%; border-collapse: collapse; }
      #bon td { vertical-align: top; padding: 1px 0; }
      #bon td.r { text-align: right; white-space: nowrap; }
    }
    @keyframes flash { 50% { transform: scale(1.03); box-shadow: inset 0 0 0 4px var(--orange), 0 0 0 8px rgba(224,38,27,.4); } }
    @media (max-width: 900px) { .board { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { .order.is-new { animation: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="gate" id="gate" hidden>
      <h1>Kun for personale</h1>
      <p id="gate-msg">Skriv adgangskoden for at se ordrerne.</p>
      <form class="login" id="login" hidden>
        <input type="password" id="pw" autocomplete="current-password" placeholder="Adgangskode" aria-label="Adgangskode" required>
        <button type="submit" id="pw-btn">Log ind</button>
      </form>
    </div>

    <div id="app" hidden>
      <header class="top">
        <h1>Chicken <span>World</span> ordrer</h1>
        <span class="live"><span class="dot" id="livedot"></span> <span id="livetext">Henter …</span></span>
        <span class="spacer"></span>
        <span class="pstat" id="pstat" title="Nye ordrer printes automatisk">🖨️ Printer automatisk</span>
        <button class="tbtn" id="logout" type="button">Log ud</button>
      </header>
      <p class="err" id="err" hidden></p>

      <div class="board">
        <section class="col col--ny"><h2>Nye <b id="c-ny">0</b></h2><div class="list" id="l-ny"></div></section>
        <section class="col"><h2>I gang <b id="c-gang">0</b></h2><div class="list" id="l-gang"></div></section>
        <section class="col"><h2>Klar / på vej <b id="c-klar">0</b></h2><div class="list" id="l-klar"></div></section>
      </div>

      <details class="done">
        <summary>Afsluttede i dag (<span id="c-done">0</span>)</summary>
        <ul id="l-done"></ul>
      </details>
    </div>
  </div>
  <div id="bon" aria-hidden="true"></div>

  <script src="site-config.js?v=45"></script>
  <script src="assets/js/star/StarWebPrintBuilder.js?v=1"></script>
  <script src="assets/js/star/StarWebPrintTrader.js?v=1"></script>
  <script>
  (function () {
    var CFG = window.CW_CONFIG || {};
    // Adgang: adgangskoden laves om til en nøgle (SHA-256), som databasen tjekker.
    // Nøglen huskes på denne enhed, så man ikke skal logge ind igen efter genindlæsning.
    var STORE = 'cw-personale';
    var KEY = '';
    // Login gælder kun til kl. 05 næste morgen, så koden skal skrives hver dag
    var RESET_HOUR = 5, until = 0;
    function nextReset() {
      var d = new Date(); d.setHours(RESET_HOUR, 0, 0, 0);
      if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
      return d.getTime();
    }
    try {
      var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (saved && saved.k && saved.until > Date.now()) { KEY = saved.k; until = saved.until; }
      else localStorage.removeItem(STORE);
    } catch (e) { try { localStorage.removeItem(STORE); } catch (er) {} }
    var fromHash = decodeURIComponent((location.hash || '').slice(1));
    if (fromHash.length >= 24) { KEY = fromHash; until = nextReset(); } // gammelt link virker stadig, indtil koden er skiftet i databasen
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var kr = function (n) { return Number(n).toLocaleString('da-DK') + ',-'; };

    if (!CFG.supabaseUrl || !CFG.supabaseKey) {
      $('gate').hidden = false;
      $('gate-msg').textContent = 'Bestilling på hjemmesiden er ikke slået til endnu.';
      return;
    }
    function showLogin(msg) {
      $('app').hidden = true; $('gate').hidden = false; $('login').hidden = false;
      $('gate-msg').textContent = msg || 'Skriv adgangskoden for at se ordrerne.';
      $('pw-btn').disabled = false; $('pw').value = ''; $('pw').focus();
    }
    function hashPw(pw) {
      var data = new TextEncoder().encode('chickenworld:' + pw.trim().toLowerCase());
      return crypto.subtle.digest('SHA-256', data).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    }
    $('login').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!$('pw').value.trim()) return;
      $('pw-btn').disabled = true;
      hashPw($('pw').value).then(function (k) {
        KEY = k;
        until = nextReset();
        try { localStorage.setItem(STORE, JSON.stringify({ k: KEY, until: until })); } catch (er) {}
        $('gate').hidden = true;
        start();
      });
    });
    $('logout').addEventListener('click', function () {
      try { localStorage.removeItem(STORE); } catch (er) {}
      KEY = ''; stop = true; showLogin();
    });

    // Gammel "anon"-nøgle (JWT) sendes også som Bearer; ny "publishable"-nøgle kun som apikey
    function apiHeaders() {
      var h = { 'Content-Type': 'application/json', apikey: CFG.supabaseKey };
      if (/^eyJ/.test(CFG.supabaseKey)) h.Authorization = 'Bearer ' + CFG.supabaseKey;
      return h;
    }
    function rpc(fn, body) {
      return fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {
        method: 'POST',
        headers: apiHeaders(),
        body: JSON.stringify(body)
      }).then(function (r) {
        return r.text().then(function (t) {
          var b = t ? JSON.parse(t) : null;
          if (!r.ok) throw new Error(b && b.message ? b.message : 'Fejl ' + r.status);
          return b;
        });
      });
    }

    // ---------- Lyd ----------
    // Lyden er altid slået til og kan ikke slås fra. Browsere tillader først lyd efter
    // første tryk på siden (fx "Log ind"), så ethvert tryk aktiverer lyden.
    var audio = null, soundOn = true;
    try { localStorage.removeItem('cw-lyd'); } catch (e) {}
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    function unlock() {
      if (audio && audio.state === 'suspended') audio.resume().catch(function () {});
      keepAwake();
    }
    ['pointerdown', 'keydown', 'touchstart', 'touchend', 'click'].forEach(function (ev) {
      document.addEventListener(ev, unlock, { passive: true });
    });
    unlock();
    function ding() {
      if (!soundOn || !audio) return;
      [0, 0.22, 0.44].forEach(function (t, i) {
        var o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = [880, 1175, 1568][i];
        g.gain.setValueAtTime(0.0001, audio.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.35);
        o.connect(g); g.connect(audio.destination);
        o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.4);
      });
    }
    var lock = null;
    function keepAwake() {
      if (!('wakeLock' in navigator) || lock) return;
      navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }, function () {});
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden && soundOn) keepAwake(); });

    // ---------- Visning ----------
    var known = null, orders = [], confirmCancel = null;
    function ago(ts) {
      var m = Math.round((Date.now() - new Date(ts).getTime()) / 60000);
      if (m < 1) return 'lige nu';
      if (m < 60) return m + ' min siden';
      return Math.floor(m / 60) + ' t ' + (m % 60) + ' min siden';
    }
    function clock(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2); }
    function itemLabel(it) {
      return (it.nr ? it.nr + '. ' : '') + (it.section ? it.section + ': ' : '') + (it.name || '') + (it.size ? ' (' + it.size + ')' : '');
    }
    var NEXT = {
      'i gang': [['klar', 'Klar', 'act--go'], ['ny', 'Tilbage', 'act--ghost']],
      'klar':   [['afhentet', 'Udleveret', 'act--go'], ['i gang', 'Tilbage', 'act--ghost']]
    };
    // Ordretype ud fra feltet "pickup": "Levering …", "Udlejning …" eller "Afhentning …"
    function kind(o) {
      var p = String(o.pickup || '');
      if (/^Levering/i.test(p)) return 'lev';
      if (/^Udlejning/i.test(p)) return 'udl';
      return 'hent';
    }
    // Adressen og betalingsformen ligger øverst i bemærkningen som "Adresse: …" og "Betaling: …"
    function splitNote(o) {
      var note = String(o.note || ''), m = note.match(/^Adresse: ([^\n]*)\n?/), addr = '', pay = '';
      if (m) { addr = m[1]; note = note.slice(m[0].length); }
      var b = note.match(/^Betaling: ([^\n]*)\n?/);
      if (b) { pay = b[1]; note = note.slice(b[0].length); }
      return { addr: addr, pay: pay, note: note };
    }
    var KIND = { lev: 'Levering', hent: 'Afhentning', udl: 'Udlejning' };
    function card(o, fresh) {
      var items = (o.items || []).map(function (it) {
        return '<li><span class="q">' + esc(it.qty) + ' ×</span><span>' + esc(itemLabel(it)) + '</span><span class="p">' + kr((it.price || 0) * (it.qty || 1)) + '</span></li>';
      }).join('');
      var isLev = kind(o) === 'lev';
      var acts = (o.status === 'ny' ? [] : (NEXT[o.status] || [])).map(function (a) {
        // Levering: "Klar" hedder "På vej", og "Udleveret" hedder "Leveret"
        if (isLev && a[0] === 'klar' && o.status === 'i gang') a = ['klar', 'På vej', a[2]];
        if (isLev && a[0] === 'afhentet') a = ['afhentet', 'Leveret', a[2]];
        var warn = a[0] === 'annulleret' && confirmCancel === o.id;
        return '<button class="act ' + (warn ? 'act--warn' : a[2]) + '" data-id="' + o.id + '" data-to="' + a[0] + '">' + (warn ? 'Tryk igen for at annullere' : a[1]) + '</button>';
      }).join('') + '<button class="act act--print" data-print="' + o.id + '" title="Print bonen igen">🖨️ Print igen</button>';
      var k = kind(o), n = splitNote(o);
      var when = String(o.pickup || '').replace(/^(Levering|Afhentning|Udlejning)\s*/i, '');
      // Nye ordrer: accepter med 15/30/45/60 min (eller til det valgte tidspunkt) – eller afvis
      var decide = '';
      if (o.status === 'ny') {
        var asap = /hurtigst/i.test(when);
        var rejecting = confirmCancel === o.id;
        decide = '<div class="decide">' +
          (k !== 'udl'
            ? '<span class="decide__lbl">Accepter – ' + (k === 'lev' ? 'leveres' : 'klar') + ' om:</span><div class="eta">' +
              [15, 30, 45, 60].map(function (m) { return '<button class="act act--go" data-accept="' + o.id + '" data-min="' + m + '">' + m + ' min</button>'; }).join('') + '</div>' +
              (asap ? '' : '<button class="act act--go" data-accept="' + o.id + '">Accepter til tiden (' + esc(when) + ')</button>')
            : '<button class="act act--go" data-accept="' + o.id + '">Accepter (' + esc(when) + ')</button>') +
          '<button class="act ' + (rejecting ? 'act--warn' : 'act--ghost') + '" data-reject="' + o.id + '">' + (rejecting ? 'Tryk igen for at afvise' : 'Afvis') + '</button>' +
          '</div>';
      }
      var promise = '';
      if (o.accepted_at && o.eta_minutes) {
        promise = '<div class="o-eta">Lovet kl. ' + clock(new Date(new Date(o.accepted_at).getTime() + o.eta_minutes * 60000)) + ' (' + o.eta_minutes + ' min)</div>';
      }
      return '<article class="order' + (fresh ? ' is-new' : '') + '">' +
        '<div class="o-head"><span class="o-id">#' + o.id + '</span>' +
        '<span class="o-pick"><span class="tag tag--' + k + '">' + KIND[k] + (k === 'lev' && o.status === 'klar' ? ' · på vej' : '') + '</span><br>' + esc(when) + '<small>Bestilt kl. ' + clock(o.created_at) + ' · ' + ago(o.created_at) + '</small></span></div>' +
        '<div class="o-who"><b>' + esc(o.name) + '</b> · <a href="tel:' + esc(o.phone) + '">' + esc(o.phone) + '</a>' + (o.email ? '<br><small>' + esc(o.email) + '</small>' : '') + '</div>' +
        (o.discount_code ? '<div class="o-disc">Rabatkode ' + esc(String(o.discount_code).toUpperCase()) + (o.discount ? ' · −' + kr(o.discount) : '') + '</div>' : '') +
        (n.addr ? '<div class="o-addr">📍 <a href="https://maps.google.com/?q=' + encodeURIComponent(n.addr) + '" target="_blank" rel="noopener">' + esc(n.addr) + '</a></div>' : '') +
        (n.pay ? '<div class="o-pay">Betaling: ' + esc(n.pay) + '</div>' : '') +
        '<ul class="o-items">' + items + '</ul>' +
        (n.note ? '<div class="o-note">' + esc(n.note) + '</div>' : '') +
        promise + decide +
        '<div class="o-foot"><span class="o-total">' + kr(o.total) + '</span><div class="acts">' + acts + '</div></div>' +
        '</article>';
    }

    // ---------- Print af bon (80 mm bonprinter) ----------
    function bonHtml(o) {
      var k = kind(o), n = splitNote(o);
      var rows = (o.items || []).map(function (it) {
        return '<tr><td>' + esc(it.qty) + ' × ' + esc(itemLabel(it)) + '</td><td class="r">' + kr((it.price || 0) * (it.qty || 1)) + '</td></tr>';
      }).join('');
      return '<h1>#' + o.id + '</h1>' +
        '<div class="big">' + KIND[k].toUpperCase() + '</div>' +
        '<div class="big">' + esc(String(o.pickup || '').replace(/^(Levering|Afhentning|Udlejning)\s*/i, '')) + '</div>' +
        '<div>Bestilt ' + new Date(o.created_at).toLocaleString('da-DK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</div><hr>' +
        '<div class="big">' + esc(o.name) + '</div><div>Tlf. ' + esc(o.phone) + '</div>' +
        (n.addr ? '<div class="big">' + esc(n.addr) + '</div>' : '') +
        (n.pay ? '<div class="big">BETALING: ' + esc(n.pay).toUpperCase() + '</div>' : '') + '<hr>' +
        '<table>' + rows + '</table><hr>' +
        (n.note ? '<div class="big">OBS: ' + esc(n.note) + '</div><hr>' : '') +
        '<table><tr><td class="big">I alt</td><td class="r big">' + kr(o.total) + '</td></tr></table>' +
        '<div>Betales ' + (k === 'lev' ? 'ved levering' : 'ved afhentning') + '</div>';
    }
    // ---------- Bon som billede til Star-printeren (576 punkter = 80 mm) ----------
    // Teksten tegnes på et canvas, så æ, ø og å altid kommer rigtigt ud.
    function bonCanvas(o) {
      var W = 576, PAD = 8, k = kind(o), n = splitNote(o);
      var c = document.createElement('canvas'), g = c.getContext('2d');
      var lines = [];
      function add(text, size, bold, right, gap) { lines.push({ t: String(text), s: size, b: bold, r: right, gap: gap || 0 }); }
      function rule() { lines.push({ rule: true }); }
      add('#' + o.id, 64, true);
      add(KIND[k].toUpperCase(), 34, true);
      add(String(o.pickup || '').replace(/^(Levering|Afhentning|Udlejning)\s*/i, ''), 30, true);
      add('Bestilt ' + new Date(o.created_at).toLocaleString('da-DK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }), 24);
      rule();
      add(o.name, 32, true); add('Tlf. ' + o.phone, 26);
      if (n.addr) add(n.addr, 30, true);
      if (n.pay) add('BETALING: ' + n.pay.toUpperCase(), 30, true);
      rule();
      (o.items || []).forEach(function (it) { lines.push({ item: true, l: it.qty + ' × ' + itemLabel(it), p: kr((it.price || 0) * (it.qty || 1)) }); });
      rule();
      if (n.note) { add('OBS: ' + n.note, 30, true); rule(); }
      lines.push({ item: true, l: 'I alt', p: kr(o.total), big: true });
      add('Betales ' + (k === 'lev' ? 'ved levering' : 'ved afhentning'), 24);

      function font(size, bold) { return (bold ? '700 ' : '400 ') + size + 'px system-ui, -apple-system, Helvetica, Arial, sans-serif'; }
      function wrap(text, size, bold, width) {
        g.font = font(size, bold);
        var out = [];
        String(text).split('\n').forEach(function (para) {
          var cur = '';
          para.split(' ').forEach(function (w) {
            var t = cur ? cur + ' ' + w : w;
            if (g.measureText(t).width > width && cur) { out.push(cur); cur = w; } else cur = t;
          });
          out.push(cur);
        });
        return out;
      }
      // Første gennemløb måler højden, andet tegner
      function layout(paint) {
        var y = PAD;
        lines.forEach(function (ln) {
          if (ln.rule) {
            if (paint) { g.fillStyle = '#000'; for (var x = PAD; x < W - PAD; x += 12) g.fillRect(x, y + 10, 7, 3); }
            y += 24; return;
          }
          if (ln.item) {
            var sz = ln.big ? 34 : 26, bold = !!ln.big;
            g.font = font(sz, bold);
            var pw = g.measureText(ln.p).width;
            var parts = wrap(ln.l, sz, bold, W - PAD * 2 - pw - 16);
            parts.forEach(function (t, i) {
              if (paint) {
                g.font = font(sz, bold); g.fillStyle = '#000'; g.textBaseline = 'top';
                g.fillText(t, PAD, y);
                if (i === 0) g.fillText(ln.p, W - PAD - pw, y);
              }
              y += Math.round(sz * 1.3);
            });
            return;
          }
          wrap(ln.t, ln.s, ln.b, W - PAD * 2).forEach(function (t) {
            if (paint) { g.font = font(ln.s, ln.b); g.fillStyle = '#000'; g.textBaseline = 'top'; g.fillText(t, PAD, y); }
            y += Math.round(ln.s * 1.3);
          });
        });
        return y + PAD;
      }
      c.width = W; c.height = 10;
      var h = layout(false);
      c.width = W; c.height = h;
      g.fillStyle = '#fff'; g.fillRect(0, 0, W, h);
      layout(true);
      return c;
    }

    // ---------- Print ----------
    // I appen "Star webPRNT Browser" printes direkte på Star-printeren uden dialog.
    // I en almindelig browser bruges browserens print.
    var STAR = /webPRNT/i.test(navigator.userAgent) && typeof StarWebPrintTrader === 'function';
    var STAR_URL = 'http://localhost:8001/StarWebPRNT/SendMessage';
    function setPstat(text, cls) {
      var el = $('pstat'); el.textContent = text;
      el.classList.toggle('is-ok', cls === 'ok'); el.classList.toggle('is-bad', cls === 'bad');
    }
    setPstat(STAR ? '🖨️ Star-printer · printer automatisk' : '🖨️ Printer automatisk');

    var printQueue = [], printing = false;
    function printOrder(o) { printQueue.push(o); if (!printing) nextPrint(); }
    function nextPrint() {
      var o = printQueue.shift();
      if (!o) { printing = false; return; }
      printing = true;
      if (STAR) return starPrint(o, function () { setTimeout(nextPrint, 300); });
      $('bon').innerHTML = bonHtml(o);
      setTimeout(function () { window.print(); setTimeout(nextPrint, 400); }, 50);
    }
    function starPrint(o, done) {
      var c = bonCanvas(o), b = new StarWebPrintBuilder();
      var req = b.createInitializationElement() +
        b.createBitImageElement({ context: c.getContext('2d'), x: 0, y: 0, width: c.width, height: c.height }) +
        b.createCutPaperElement({ feed: true, type: 'partial' });
      var t = new StarWebPrintTrader({ url: STAR_URL, papertype: 'normal' });
      window.trader = t; // Star-appen kalder tilbage via en global "trader"
      t.onReceive = function (r) {
        var ok = String(r.traderSuccess) === 'true';
        if (ok) setPstat('🖨️ Printet #' + o.id + ' kl. ' + clock(new Date()), 'ok');
        else setPstat('⚠️ Printer: ' + (t.isPaperEnd && t.isPaperEnd(r) ? 'papiret er tomt' : t.isCoverOpen && t.isCoverOpen(r) ? 'låget er åbent' : 'fejl (kode ' + r.traderCode + ')') + ' – tryk "Print igen"', 'bad');
        done();
      };
      t.onError = function (r) { setPstat('⚠️ Printeren svarer ikke – tjek kablet og tryk "Print igen"', 'bad'); done(); };
      t.onTimeout = function () { setPstat('⚠️ Printeren svarer ikke – tryk "Print igen"', 'bad'); done(); };
      try { t.sendMessage({ request: req }); } catch (e) { setPstat('⚠️ Kunne ikke printe: ' + e.message, 'bad'); done(); }
    }

    function draw(freshIds) {
      var groups = { 'ny': [], 'i gang': [], 'klar': [], done: [] };
      orders.forEach(function (o) { (groups[o.status] || groups.done).push(o); });
      // Ældste først i de aktive kolonner
      ['ny', 'i gang', 'klar'].forEach(function (s) { groups[s].sort(function (a, b) { return a.id - b.id; }); });
      [['ny', 'ny'], ['i gang', 'gang'], ['klar', 'klar']].forEach(function (p) {
        var list = groups[p[0]];
        $('c-' + p[1]).textContent = list.length;
        $('l-' + p[1]).innerHTML = list.length ? list.map(function (o) { return card(o, freshIds.indexOf(o.id) !== -1); }).join('') : '<p class="empty">Ingen ordrer</p>';
      });
      $('c-done').textContent = groups.done.length;
      $('l-done').innerHTML = groups.done.map(function (o) {
        return '<li><b>#' + o.id + '</b> ' + esc(o.name) + ' · ' + kr(o.total) + ' <span class="st">' + esc(o.status === 'afhentet' && kind(o) === 'lev' ? 'leveret' : o.status) + '</span>' +
          '<button data-id="' + o.id + '" data-to="' + (o.status === 'afvist' || o.status === 'annulleret' ? 'ny' : 'klar') + '">Fortryd</button></li>';
      }).join('');
      var n = groups['ny'].length;
      document.title = (n ? '(' + n + ') ' : '') + 'Ordrer – Chicken World';
    }

    function load() {
      return rpc('staff_orders', { p_key: KEY, p_hours: 18 }).then(function (list) {
        orders = list || [];
        var ids = orders.map(function (o) { return o.id; });
        var fresh = known ? ids.filter(function (id) { return known.indexOf(id) === -1; }) : [];
        known = ids;
        draw(fresh);
        if (fresh.length) {
          ding();
          orders.filter(function (o) { return fresh.indexOf(o.id) !== -1; }).sort(function (a, b) { return a.id - b.id; }).forEach(printOrder);
        }
        $('err').hidden = true;
        $('livedot').classList.remove('is-off');
        var d = new Date();
        $('livetext').textContent = 'Opdateret kl. ' + ('0' + d.getHours()).slice(-2) + '.' + ('0' + d.getMinutes()).slice(-2) + '.' + ('0' + d.getSeconds()).slice(-2);
        $('app').hidden = false;
      }).catch(function (e) {
        if (/Adgang/.test(e.message)) {
          try { localStorage.removeItem(STORE); } catch (er) {}
          KEY = ''; stop = true;
          showLogin('Forkert adgangskode. Prøv igen.');
          return;
        }
        $('app').hidden = false;
        $('livedot').classList.add('is-off');
        $('livetext').textContent = 'Ingen forbindelse, prøver igen …';
      });
    }

    document.addEventListener('click', function (e) {
      var pb = e.target.closest('button[data-print]');
      if (pb) { var po = orders.filter(function (x) { return x.id === Number(pb.dataset.print); })[0]; if (po) printOrder(po); return; }
      // Accepter / afvis. Virker også før databasen er opdateret (så uden tid).
      var ab = e.target.closest('button[data-accept]');
      if (ab) {
        var aid = Number(ab.dataset.accept), min = ab.dataset.min ? Number(ab.dataset.min) : null;
        confirmCancel = null;
        var ao = orders.filter(function (x) { return x.id === aid; })[0];
        if (ao) { ao.status = 'i gang'; ao.eta_minutes = min; ao.accepted_at = new Date().toISOString(); draw([]); }
        rpc('staff_accept', { p_key: KEY, p_id: aid, p_minutes: min }).catch(function (err) {
          if (/staff_accept|function|schema/i.test(err.message)) return rpc('staff_set_status', { p_key: KEY, p_id: aid, p_status: 'i gang' });
          throw err;
        }).catch(function (err) {
          $('err').textContent = 'Kunne ikke acceptere ordren: ' + err.message; $('err').hidden = false;
        }).then(load);
        return;
      }
      var rb = e.target.closest('button[data-reject]');
      if (rb) {
        var rid = Number(rb.dataset.reject);
        if (confirmCancel !== rid) { confirmCancel = rid; draw([]); return; }
        confirmCancel = null;
        var ro = orders.filter(function (x) { return x.id === rid; })[0];
        if (ro) { ro.status = 'afvist'; draw([]); }
        rpc('staff_reject', { p_key: KEY, p_id: rid }).catch(function (err) {
          if (/staff_reject|function|schema/i.test(err.message)) return rpc('staff_set_status', { p_key: KEY, p_id: rid, p_status: 'annulleret' });
          throw err;
        }).catch(function (err) {
          $('err').textContent = 'Kunne ikke afvise ordren: ' + err.message; $('err').hidden = false;
        }).then(load);
        return;
      }
      var b = e.target.closest('button[data-to]');
      if (!b) return;
      var id = Number(b.dataset.id), to = b.dataset.to;
      if (to === 'annulleret' && confirmCancel !== id) { confirmCancel = id; draw([]); return; }
      confirmCancel = null;
      var o = orders.filter(function (x) { return x.id === id; })[0];
      if (o) { o.status = to; draw([]); }
      rpc('staff_set_status', { p_key: KEY, p_id: id, p_status: to }).catch(function (err) {
        $('err').textContent = 'Kunne ikke gemme ændringen: ' + err.message; $('err').hidden = false;
      }).then(load);
    });

    var stop = true, run = 0;
    function start() {
      stop = false; known = null; var me = ++run;
      (function tick() { if (stop || me !== run) return; load().then(function () { setTimeout(tick, 7000); }); })();
    }
    if (KEY.length >= 24) start(); else showLogin();
    setInterval(function () {
      if (!stop && until && Date.now() > until) { // ny dag: log ud
        try { localStorage.removeItem(STORE); } catch (er) {}
        KEY = ''; until = 0; stop = true;
        showLogin('Godmorgen! Skriv adgangskoden for at se dagens ordrer.');
        return;
      }
      if (!stop && orders.length) draw([]);
    }, 30000); // opdater "x min siden"
  })();
  </script>
</body>
